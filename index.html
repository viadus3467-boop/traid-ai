<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090909" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Trade Ai is a mobile-first AI trading app with selective LONG and SHORT signals."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Trade Ai" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    <title>Trade Ai</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icon-maskable-512.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-theme="dark">
    <div class="ambient ambient-left"></div>
    <div class="ambient ambient-right"></div>
    <div id="appRoot"></div>
    <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
